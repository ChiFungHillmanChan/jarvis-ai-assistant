[package]
name = "jarvis"
version = "0.5.4"
description = "JARVIS - Personal AI Assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "jarvis_lib"
# Desktop only. The Tauri template's "cdylib" and "staticlib" exist for the
# Android and iOS builds; on macOS they only added a ~300 MB archive and a
# second link to every build.
crate-type = ["lib"]

[features]
# Explicit, debug-only desktop QA with synthetic mail and no login Keychain.
native-qa = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }
refinery = { version = "0.9", features = ["rusqlite"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
log = "0.4"
thiserror = "2"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
dotenvy = "0.15"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
tokio-cron-scheduler = "0.13"
croner = "2.2"
uuid = { version = "1", features = ["v4"] }
open = "5"
cpal = "0.17"
hound = "3.5"
shellexpand = "3"
base64 = "0.22.1"
urlencoding = "2.1.3"
whisper-rs = "0.16.0"
futures-util = "0.3"
encoding_rs = "0.8"
tiktoken-rs = "0.6"
sysinfo = "0.33"
async-trait = "0.1"
tokio-util = "0.7"
cocoa = "0.26"
aws-config = "1.8.16"
aws-sdk-bedrockruntime = { version = "1.130.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.4.7"
aws-credential-types = "1.2"
security-framework = "2.11"
sha2 = "0.10"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# A full-debuginfo dev build of this dependency tree measured 34 GB of
# `target/debug`, nearly all of it object files for crates nobody steps through.
# Line tables are enough to read a backtrace from our own code; third-party
# crates get none at all. Keeps a working tree in single-digit GB.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# macOS 27's linker can emit an unloadable proc-macro dylib when debug
# information is stripped (dyld: mis-aligned LINKEDIT string pool / E0463).
# This host-only build tool is not included in the distributed app.
[profile.dev.package.tauri-macros]
strip = "none"
