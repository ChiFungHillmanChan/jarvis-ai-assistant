[env]
SOURCE_DATE_EPOCH = "1"
GGML_NATIVE = "OFF"
# Must match `bundle.macOS.minimumSystemVersion` in tauri.conf.json. When these
# disagreed (11.0 here, 12.0 there) the shipped binary advertised support for a
# release the bundle refused to install on.
MACOSX_DEPLOYMENT_TARGET = "12.0"

# Sign the dev binary with a stable identity before running it, so Keychain
# "Always Allow" survives rebuilds. See scripts/dev-run.sh.
[target.aarch64-apple-darwin]
runner = "scripts/dev-run.sh"

[target.x86_64-apple-darwin]
runner = "scripts/dev-run.sh"
