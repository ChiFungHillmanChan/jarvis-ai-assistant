name: CI

# Pushes to main, and pull requests. A push to a branch with an open pull
# request used to run twice (push + pull_request) without cancelling either.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (type-check, build, cargo test)
    # macOS only, and not a preference: this crate depends on cocoa,
    # security-framework and whisper-rs, none of which build on ubuntu.
    # Runs on the founder's Mac (self-hosted, label jarvis-mac): GitHub-hosted
    # macOS minutes count ten-fold against the plan and ran out in September.
    # To go back, set runs-on to macos-latest.
    runs-on: [self-hosted, jarvis-mac]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Cargo registry, git checkouts and build artifacts. Keyed on the lockfile
      # so a dependency change invalidates it; the restore-key still gives a
      # warm target/ dir when only source changed.
      # The self-hosted workspace keeps target/ between runs, and restoring into
      # ~/.cargo would overwrite the Mac's own registry.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: npm ci

      # `tsc && vite build`. Two jobs in one: it is the frontend type-check, and
      # it produces ../dist, which tauri::generate_context!() embeds at compile
      # time -- without it the Rust build fails before a single test runs.
      - name: Type-check and build the frontend
        run: npm run build

      - name: Frontend workspace tests
        run: npm run test:frontend

      # Same command a developer runs locally: see package.json "test".
      - name: Rust tests
        run: npm test

      # Advisory only. The existing warnings have never been triaged, so gating
      # on clippy would make CI red on day one and teach everyone to ignore it.
      # Turn `continue-on-error` off once `cargo clippy -- -D warnings` is clean.
      # `cargo fmt --check` is deliberately absent for the same reason: the tree
      # is not rustfmt-clean today (verified against src-tauri/src/ai/routing.rs).
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
