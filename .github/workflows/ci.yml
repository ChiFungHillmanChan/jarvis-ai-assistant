name: CI

# Only a push or merge to main runs CI. Branch pushes and pull requests do
# not: run `npm test`, `npm run build` and `npm run test:frontend` locally
# before merging. Private-repo macOS minutes count ten-fold against the plan.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (type-check, build, cargo test)
    # macOS only, and not a preference: this crate depends on cocoa,
    # security-framework and whisper-rs, none of which build on ubuntu.
    # The repository variable CI_RUNS_ON picks the runner. Until the included
    # minutes reset on 1 October 2026 it is ["self-hosted","jarvis-mac"] (the
    # founder's Mac); a job on that Mac deletes it on 1 October, which puts CI
    # back on GitHub's macos-latest without a code change.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@v5

      # On the self-hosted Mac, setup-node's npm cache is the founder's whole
      # ~/.npm (10 GB): saving it to GitHub stalled the job. GitHub-hosted only.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      # Cargo registry, git checkouts and build artifacts. Keyed on the lockfile
      # so a dependency change invalidates it; the restore-key still gives a
      # warm target/ dir when only source changed.
      # The self-hosted workspace keeps target/ between runs, and restoring into
      # ~/.cargo would overwrite the Mac's own registry.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: npm ci

      # `tsc && vite build`. Two jobs in one: it is the frontend type-check, and
      # it produces ../dist, which tauri::generate_context!() embeds at compile
      # time -- without it the Rust build fails before a single test runs.
      - name: Type-check and build the frontend
        run: npm run build

      - name: Frontend workspace tests
        run: npm run test:frontend

      # Same command a developer runs locally: see package.json "test".
      - name: Rust tests
        run: npm test

      # Advisory only. The existing warnings have never been triaged, so gating
      # on clippy would make CI red on day one and teach everyone to ignore it.
      # Turn `continue-on-error` off once `cargo clippy -- -D warnings` is clean.
      # `cargo fmt --check` is deliberately absent for the same reason: the tree
      # is not rustfmt-clean today (verified against src-tauri/src/ai/routing.rs).
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      # Blocking, unlike the clippy step above, and limited to one lint.
      # PR #50 fixed a stack overflow: the future of `send_message` had grown
      # to 456 KB, and in a debug build every typed chat message aborted the
      # app. Nothing failed before the app ran, so this fails the job when any
      # future in the crate grows past `future-size-threshold` (see
      # src-tauri/clippy.toml). Fix it by moving the large value to the heap
      # (`Box::pin`), not by raising the threshold.
      - name: Large futures guard
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -A clippy::all -D clippy::large_futures
