name: Registry check

# Checks a pull request that touches the model registry before it is merged:
# the validator, the type check and both registry test files. When the base
# branch already holds registry/registry.json and the pull request changes
# it, the version must be higher than the base's, so the publishing rule
# (registry/publish.sh) is checked before merge; an unchanged file is not
# published again, so it needs no new version.
#
# Read-only: no environment, no secret, no AWS, and no checkout keeps the
# token. Publishing is registry.yml, which has no pull-request trigger.
# Every action is pinned to a full commit SHA (the release it is, in the
# comment).
on:
  pull_request:
    paths:
      - "registry/**"
      - "tests/registry*.ts"
      - ".github/workflows/registry.yml"
      - ".github/workflows/registry-check.yml"

permissions:
  contents: read

concurrency:
  group: registry-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The base branch's registry file only, to compare the version with.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.base_ref }}
          path: base
          sparse-checkout: registry/registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # Install scripts are not run in any registry job.
      - run: npm ci --ignore-scripts
      - name: Validate the registry
        run: |
          if [ ! -f base/registry/registry.json ]; then
            echo "registry: the base branch has no registry yet; no version to compare with"
            node --experimental-strip-types registry/validate.ts registry/registry.json
          elif cmp -s registry/registry.json base/registry/registry.json; then
            echo "registry: registry.json is unchanged from the base branch; nothing new to publish"
            node --experimental-strip-types registry/validate.ts registry/registry.json
          else
            node --experimental-strip-types registry/validate.ts registry/registry.json --published base/registry/registry.json
          fi
      - name: Type check (registry code and tests)
        run: npm run registry:typecheck
      - name: Registry tests (code match, validator, signing, publish script)
        run: node --experimental-strip-types --test tests/registry.test.ts tests/registry-publish.test.ts
